[theme]
font = "sans serif"

[theme.light]
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#172554"

[theme.dark]
primaryColor = "#60a5fa"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"

[browser]
gatherUsageStats = false
[server]
address = "127.0.0.1"
headless = true
maxUploadSize = 20
